{% extends 'base.html' %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="card form-card">
    <h2>Alert settings</h2>
    <form method="post">
        {{ form.hidden_tag() }}
        <div class="field">
            {{ form.sound_choice.label }}
            {{ form.sound_choice }}
        </div>
        <div class="field">
            {{ form.volume.label }}
            {{ form.volume }}
        </div>
        <div class="field checkbox-row">
            {{ form.enabled }}
            {{ form.enabled.label }}
        </div>
        <button class="btn btn-primary" type="submit">Save settings</button>
    </form>
</div>
{% endblock %}
