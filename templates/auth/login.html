{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card form-card small-card">
    <h2>Welcome back</h2>
    <form method="post">
        {{ form.hidden_tag() }}
        <div class="field">
            {{ form.email.label }}
            {{ form.email }}
        </div>
        <div class="field">
            {{ form.password.label }}
            {{ form.password }}
        </div>
        <button class="btn btn-primary" type="submit">Login</button>
    </form>
</div>
{% endblock %}
